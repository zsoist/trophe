name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      PG_HOST: 127.0.0.1
      PG_PORT: 5432
      PG_USER: postgres
      PG_PASS: postgres
      PG_DB: trophe_dev
      PGPASSWORD: postgres
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/trophe_dev
      NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-anon-key
      SUPABASE_SERVICE_ROLE_KEY: ci-service-role-key
      CI: true
      SKIP_SUPABASE_START: 1
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      VOYAGE_API_KEY: ${{ secrets.VOYAGE_API_KEY }}
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        # Full history: gitleaks-action does a "partial scan" on a shallow clone
        # and writes a warning to stderr that the action treats as a hard error
        # ("stderr is not empty"). A full scan avoids the partial-scan path.
        with:
          fetch-depth: 0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: npm

      - name: Install PostgreSQL and media verification tools
        # Workout media tests decode every checked-in VP9 loop and construct
        # adversarial fixtures, so both ffmpeg and ffprobe must be available.
        run: sudo apt-get update && sudo apt-get install -y postgresql-client ffmpeg

      - name: Install dependencies
        run: npm ci

      - name: Audit production dependencies (high+)
        # Dev-tooling vulns (esbuild via drizzle-kit/tsx) are tracked separately;
        # this gate covers what actually ships.
        run: npm audit --audit-level=high --omit=dev

      - name: Scan for leaked secrets (gitleaks)
        uses: gitleaks/gitleaks-action@dcedce43c6f43de0b836d1fe38946645c9c638dc # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Guard against drizzle-kit introspect wrapper
        run: |
          for f in drizzle/0*.sql; do
            if head -3 "$f" | grep -qE '^[[:space:]]*/\*'; then
              echo "::error file=$f::Migration starts with /* — drizzle-kit introspect wrapper not stripped. Run the migration through bootstrap-local.sh before committing."
              exit 1
            fi
          done
          echo "✅ No uncommitted drizzle-kit introspect wrappers found"

      - name: Guard — migration journal in sync with SQL files
        # Fast fail (seconds, not 5 min into the test suite) for the common drift:
        # a hand-written drizzle/NNNN_*.sql applied out-of-band (e.g. Supabase MCP)
        # without a matching drizzle/meta/_journal.json entry. Mirrors
        # tests/db/migration-journal.test.ts but runs early with a clear message.
        run: |
          set -euo pipefail
          files=$(ls drizzle/0*.sql 2>/dev/null | xargs -n1 basename | sed 's/\.sql$//' | sort)
          tags=$(node -e "const j=require('./drizzle/meta/_journal.json'); console.log(j.entries.map(e=>e.tag).sort().join('\n'))")
          if [ "$files" != "$tags" ]; then
            echo "::error::drizzle/meta/_journal.json is out of sync with drizzle/*.sql."
            echo "::error::Add each new migration to the journal (unique idx + unique 'when'), or run drizzle-kit generate."
            diff <(echo "$files") <(echo "$tags") || true
            exit 1
          fi
          echo "✅ Migration journal matches SQL files"

      - name: Guard — golden tolerance changes are justified per commit
        run: npm run guard:golden-tolerances

      - name: Guard — eval and smoke identities come from env
        run: npm run guard:eval-identity

      - name: Guard — retired DeepSeek aliases are absent
        run: |
          set -euo pipefail
          legacy_chat=$(printf '%s%s%s' deepseek - chat)
          legacy_reasoner=$(printf '%s%s%s' deepseek - reasoner)
          if git grep -nE "${legacy_chat}|${legacy_reasoner}"; then
            echo "::error::Retired DeepSeek model alias found. Use the routed V4 policy object."
            exit 1
          fi
          echo "✅ Retired DeepSeek aliases absent"

      - name: Verify hardcode guard catches known-bad fixture
        # Self-test: confirms grep works in this CI environment.
        # If this step fails to FIND the fixture, the real guard is broken.
        run: |
          set -euo pipefail
          if grep -rEn 'brain_user|127\.0\.0\.1:5433|localhost:5433' \
               tests/_guard_fixtures/; then
            echo "✅ Guard fixture detected as expected — grep is working"
          else
            echo "::error::Guard self-test FAILED. grep could not find the known-bad fixture."
            echo "::error::The real guard below cannot be trusted. Investigate before merging."
            exit 1
          fi

      - name: Guard against hardcoded local DB credentials in source
        # grep is available on every Ubuntu runner — no install required.
        # Scripts (scripts/**) excluded: they default to local ports by design.
        # grep exits 0 on match (fires if-branch → exit 1 to fail CI),
        # exits 1 on no match (guard passes). No || true suppressor.
        run: |
          set -euo pipefail
          if grep -rEn 'brain_user|127\.0\.0\.1:5433|localhost:5433' \
               --include='*.ts' --include='*.tsx' \
               tests/ agents/ lib/ app/ db/; then
            echo "::error::Source files contain hardcoded local DB credentials. Use DATABASE_URL — see .env.local.example."
            exit 1
          fi
          echo "✅ No hardcoded local DB credentials found in source code"

      - name: Bootstrap local database
        run: npm run db:bootstrap

      - name: Verify DB inventory
        run: npm run db:verify

      - name: Capture DB explain plans
        run: npm run db:explain

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint -- --no-cache

      - name: Unit and integration tests (coverage-enforced)
        # test:coverage = vitest run --coverage; enforces the vitest.config.ts thresholds
        # so the coverage gate actually runs in required CI (not merely configured).
        run: npm run test:coverage

      - name: Nutrition safety and release-gate tests
        run: npm test -- --run tests/agents/nutrition-release-gate.test.ts tests/agents/nutrition-enterprise-dataset.test.ts tests/agents/food-parse.accuracy.test.ts tests/agents/food-parse-structured-output.test.ts

      - name: Food database readiness
        run: npm run food:readiness
        env:
          # CI bootstraps only deterministic local lookup fixtures, not the full
          # production food corpus. These values still fail loud if the fixture
          # seed disappears or loses authoritative metadata. The local bootstrap
          # currently has 101 rows, 97.0% authoritative, and 87 non-fixture rows
          # without embeddings; prod readiness remains a separate prod-data gate.
          FOOD_MINIMUM_ROWS: 14
          FOOD_MIN_AUTHORITATIVE_RATE: 0.95
          FOOD_MAX_MISSING_EMBEDDINGS: 87

      - name: RAG safety and release-gate tests
        run: npm test -- --run tests/agents/rag.test.ts tests/agents/rag-release-gate.test.ts tests/agents/rag-eval-dataset.test.ts tests/agents/rag-observed-retrieval.test.ts tests/db/rag-rls.test.ts

      - name: RAG ingestion readiness
        run: npm run rag:readiness

      - name: Enterprise readiness checks
        run: npm run readiness

      - name: Agent routing and eval contracts (no paid calls)
        run: npm test -- --run tests/agents/phase3-routing-policy.test.ts tests/agents/golden-tolerance-guard.test.ts tests/agents/food-parse-watchlist.test.ts

      - name: AI cost attribution and budget gate
        run: npm run ai:budget-check

      - name: AI cost reconciliation gate
        run: npm run ai:cost-reconcile

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: E2E smoke tests
        run: npm run test:e2e

      - name: Production build
        run: npm run build

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-report
          path: playwright-report/
          if-no-files-found: ignore

      - name: Upload eval reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: agent-eval-reports
          path: artifacts/evals/
          if-no-files-found: ignore

      - name: Upload DB artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: db-artifacts
          path: artifacts/db/
          if-no-files-found: ignore
