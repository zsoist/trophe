name: Nutrition benchmark (on-demand)

on:
  # On-demand ONLY — deliberately NOT scheduled. The enterprise benchmark calls the live
  # prod API over the full ~700-case corpus (one DeepSeek call per food-parse), so a nightly
  # run would burn ~700 LLM calls/day for no per-release signal. Trigger manually before a
  # release that touches nutrition accuracy.
  workflow_dispatch: {}

concurrency:
  group: nightly-eval
  cancel-in-progress: true

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      EVAL_ENFORCE_GATE: 1
      EVAL_MIN_PASS_RATE: 0.40
      # The enterprise benchmark calls the live prod API, which is auth-gated.
      # Without these it 401s on every food-parse call → the run has always failed.
      # Set these repo secrets (Settings → Secrets → Actions) to green it:
      #   EVAL_AUTH_EMAIL, EVAL_AUTH_PASSWORD (a seeded eval user),
      #   NEXT_PUBLIC_SUPABASE_URL, NEXT_PUBLIC_SUPABASE_ANON_KEY
      TROPHE_API: https://trophe.app
      EVAL_DATASET: v2
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      EVAL_AUTH_EMAIL: ${{ secrets.EVAL_AUTH_EMAIL }}
      EVAL_AUTH_PASSWORD: ${{ secrets.EVAL_AUTH_PASSWORD }}

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run enterprise nutrition benchmark
        run: npm run evals:nutrition:enterprise

      - name: Upload benchmark artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nutrition-benchmark-${{ github.run_number }}
          path: artifacts/evals/
          retention-days: 90
