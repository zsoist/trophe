<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <meta name="theme-color" content="#0a0a0a" />
    <title>You are offline — trophē</title>
    <style>
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        background: #0a0a0a;
        color: #f5f5f4;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      main { width: min(100%, 420px); text-align: center; }
      .brand { margin-bottom: 24px; color: #d4a853; font: italic 32px Georgia, serif; }
      h1 { margin: 0 0 10px; font-size: 22px; }
      p { margin: 0 0 24px; color: #a8a29e; line-height: 1.55; }
      a {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 44px;
        padding: 0 22px;
        border: 0;
        border-radius: 12px;
        background: #d4a853;
        color: #0a0a0a;
        font: inherit;
        font-weight: 700;
        text-decoration: none;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="brand">trophē</div>
      <h1>You are offline</h1>
      <p>
        Your data is safe. Reconnect and try again to continue.
      </p>
      <a href="/">Try again</a>
    </main>
  </body>
</html>
